<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYT Style Table Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+KR:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── ROOT VARS ─── */
:root {
  --ink: #111;
  --ink-mid: #444;
  --ink-light: #888;
  --rule-heavy: #1a1a1a;
  --rule-light: #d8d4cc;
  --cream: #f9f6f0;
  --card-bg: #fffdf9;
  --highlight: #f0ede6;
  --accent: #8B2500;
  --editor-bg: #1c1c1e;
  --editor-panel: #2a2a2d;
  --editor-border: #3a3a3e;
  --editor-text: #e8e6e0;
  --editor-label: #a0a09a;
  --editor-input-bg: #212124;
  --editor-accent: #c9a96e;
  --editor-danger: #c0392b;
  --editor-section: #35353a;
  --mono: 'DM Mono', 'Courier New', monospace;
}

/* ─── LAYOUT ─── */
body {
  background: var(--editor-bg);
  color: var(--editor-text);
  font-family: 'Source Serif 4', Georgia, serif;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 420px 1fr;
  grid-template-rows: 52px 1fr;
  grid-template-areas: "topbar topbar" "editor preview";
}

/* ─── TOPBAR ─── */
#topbar {
  grid-area: topbar;
  background: #111;
  border-bottom: 1px solid #2a2a2a;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}

#topbar .brand {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--editor-accent);
  letter-spacing: 0.02em;
  flex: 1;
}

#topbar .brand span {
  font-weight: 400;
  color: #666;
  font-size: 13px;
  margin-left: 10px;
  font-family: var(--mono);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  letter-spacing: 0.05em;
  transition: all 0.15s;
}

.btn-ghost {
  background: transparent;
  color: var(--editor-label);
  border: 1px solid var(--editor-border);
}
.btn-ghost:hover { background: var(--editor-panel); color: var(--editor-text); }

.btn-gold {
  background: var(--editor-accent);
  color: #1a1000;
  font-weight: 600;
}
.btn-gold:hover { background: #d4b57a; }

/* ─── EDITOR PANEL ─── */
#editor {
  grid-area: editor;
  background: var(--editor-panel);
  border-right: 1px solid var(--editor-border);
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-block {
  background: var(--editor-bg);
  border: 1px solid var(--editor-border);
  border-radius: 4px;
  overflow: hidden;
}

.section-block-header {
  background: var(--editor-section);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--editor-accent);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-block-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--editor-label);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

input[type="text"], textarea {
  background: var(--editor-input-bg);
  border: 1px solid var(--editor-border);
  border-radius: 3px;
  color: var(--editor-text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus, textarea:focus {
  border-color: var(--editor-accent);
}
textarea { resize: vertical; min-height: 52px; line-height: 1.5; }

/* ─── ROWS EDITOR ─── */
.rows-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-divider-item {
  background: var(--editor-section);
  border: 1px solid var(--editor-border);
  border-radius: 3px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-divider-item input {
  flex: 1;
  font-style: italic;
  color: var(--editor-accent);
}

.row-item {
  background: var(--editor-input-bg);
  border: 1px solid var(--editor-border);
  border-radius: 3px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.row-item.highlighted {
  border-color: var(--editor-accent);
  background: #1f1a10;
}

.row-item-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.row-item-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 8px;
  align-items: center;
}

.row-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}

.mini-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--editor-label);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: block;
  margin-bottom: 3px;
}

.badge-select {
  background: var(--editor-input-bg);
  border: 1px solid var(--editor-border);
  border-radius: 3px;
  color: var(--editor-text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 8px;
  width: 100%;
  outline: none;
  cursor: pointer;
}
.badge-select:focus { border-color: var(--editor-accent); }

.toggle-btn {
  padding: 5px 9px;
  font-size: 10px;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--editor-border);
  background: transparent;
  color: var(--editor-label);
  font-family: var(--mono);
  white-space: nowrap;
  transition: all 0.12s;
}
.toggle-btn:hover { background: var(--editor-section); color: var(--editor-text); }
.toggle-btn.active {
  background: var(--editor-accent);
  color: #1a1000;
  border-color: var(--editor-accent);
}

.icon-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid var(--editor-border);
  background: transparent;
  color: var(--editor-label);
  font-size: 13px;
  transition: all 0.12s;
  flex-shrink: 0;
}
.icon-btn:hover { background: #3a3a3e; color: var(--editor-text); }
.icon-btn.danger:hover { background: var(--editor-danger); border-color: var(--editor-danger); color: #fff; }
.icon-btn.move { cursor: grab; }

.add-row-area {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.add-btn {
  flex: 1;
  padding: 8px;
  background: transparent;
  border: 1px dashed var(--editor-border);
  border-radius: 3px;
  color: var(--editor-label);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.add-btn:hover {
  border-color: var(--editor-accent);
  color: var(--editor-accent);
  background: #1f1a10;
}

/* ─── PREVIEW ─── */
#preview {
  grid-area: preview;
  background: var(--cream);
  overflow-y: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 40px;
}

/* ─── NYT TABLE CARD ─── */
.nyt-card {
  background: var(--card-bg);
  width: 100%;
  max-width: 640px;
  border-top: 3px solid var(--rule-heavy);
  border-bottom: 1px solid var(--rule-heavy);
  padding: 36px 40px 32px;
  font-family: 'Noto Serif KR', 'Source Serif 4', Georgia, serif;
}

.nyt-eyebrow {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #6b6b6b;
  margin-bottom: 10px;
}

.nyt-headline {
  font-family: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  color: #111;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.nyt-subhead {
  font-family: 'Noto Serif KR', 'Source Serif 4', Georgia, serif;
  font-size: 13.5px;
  font-weight: 300;
  color: #555;
  line-height: 1.5;
  margin-bottom: 28px;
  font-style: italic;
}

.nyt-divider {
  border: none;
  border-top: 1px solid var(--rule-light);
  margin-bottom: 24px;
}

.nyt-table {
  width: 100%;
  border-collapse: collapse;
}

.nyt-table thead tr {
  border-bottom: 1.5px solid var(--rule-heavy);
}

.nyt-table thead th {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #444;
  padding: 0 0 10px;
  text-align: left;
}

.nyt-table thead th:last-child { text-align: right; }

.nyt-table tbody tr {
  border-bottom: 1px solid var(--rule-light);
  transition: background 0.15s;
}

.nyt-table tbody tr:last-child {
  border-bottom: 1.5px solid var(--rule-heavy);
}

.nyt-table tbody tr:hover { background: #f4f0e8; }

.nyt-table td {
  padding: 13px 0;
  font-family: 'Noto Serif KR', 'Source Serif 4', Georgia, serif;
  font-size: 13.5px;
  color: #222;
  line-height: 1.4;
}

.nyt-table td.td-label {
  font-weight: 400;
  color: #333;
  width: 58%;
  padding-right: 12px;
}

.nyt-table td.td-value {
  font-weight: 600;
  text-align: right;
  color: #111;
  white-space: nowrap;
}

.nyt-table td.td-value .unit {
  font-weight: 300;
  color: #777;
  font-size: 11.5px;
  margin-left: 2px;
}

.nyt-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  margin-left: 6px;
  vertical-align: middle;
  font-family: 'Source Serif 4', Georgia, serif;
}

.badge-dark { background: #1a1a1a; color: #fff; }
.badge-muted { background: #e8e0d0; color: #5a4a2a; }
.badge-red { background: #8B2500; color: #fff; }
.badge-green { background: #1a4a1a; color: #e0f0e0; }

.nyt-table tr.row-highlighted { background: #f0ede6; }

.nyt-section-label {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #999;
}

.nyt-section-label td {
  padding-top: 20px !important;
  padding-bottom: 4px !important;
  color: #999 !important;
  font-size: 9.5px !important;
  letter-spacing: 0.14em !important;
  text-transform: uppercase;
  font-weight: 400 !important;
  font-family: 'Source Serif 4', Georgia, serif !important;
  border-bottom: none !important;
}

.nyt-footer {
  margin-top: 20px;
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 11px;
  color: #999;
  line-height: 1.6;
  letter-spacing: 0.01em;
}

/* ─── SCROLLBAR ─── */
#editor::-webkit-scrollbar { width: 6px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb { background: #3a3a3e; border-radius: 3px; }

/* ─── DRAG OVER ─── */
.drag-over { outline: 2px dashed var(--editor-accent); outline-offset: 2px; }

/* ─── EXPORT MODAL ─── */
#export-modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#export-modal.open { display: flex; }

.modal-box {
  background: var(--editor-panel);
  border: 1px solid var(--editor-border);
  border-radius: 6px;
  width: 90%;
  max-width: 700px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--editor-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--editor-accent);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.modal-body {
  flex: 1;
  overflow: auto;
  padding: 16px 20px;
}

.modal-body textarea {
  height: 380px;
  font-size: 11px;
  line-height: 1.6;
  color: #b0e0a0;
  background: #0d1a0d;
  border-color: #2a4a2a;
}

.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--editor-border);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="brand">NYT Table Builder <span>editorial · 편집기</span></div>
  <button class="btn btn-ghost" onclick="resetToDefault()">↺ 초기화</button>
  <button class="btn btn-ghost" onclick="openExport()">&lt;/&gt; HTML 내보내기</button>
  <button class="btn btn-gold" onclick="downloadHTML()">↓ 다운로드</button>
</div>

<!-- EDITOR -->
<div id="editor">

  <!-- Header Fields -->
  <div class="section-block">
    <div class="section-block-header">📰 헤더 텍스트</div>
    <div class="section-block-body">
      <div class="field-row">
        <div class="field-label">Eyebrow (눈썹 텍스트)</div>
        <input type="text" id="f-eyebrow" value="공모주 분석 · IPO Report" oninput="render()">
      </div>
      <div class="field-row">
        <div class="field-label">Headline (헤드라인)</div>
        <input type="text" id="f-headline" value="코스피 신규 상장 공모 현황" oninput="render()">
      </div>
      <div class="field-row">
        <div class="field-label">Subhead (부제)</div>
        <textarea id="f-subhead" oninput="render()">밴드 하단 공모가 확정, 의무보유확약 50% 돌파</textarea>
      </div>
    </div>
  </div>

  <!-- Column Headers -->
  <div class="section-block">
    <div class="section-block-header">📋 컬럼 헤더</div>
    <div class="section-block-body">
      <div class="field-row">
        <div class="field-label">왼쪽 컬럼 헤더</div>
        <input type="text" id="f-col-left" value="항목" oninput="render()">
      </div>
      <div class="field-row">
        <div class="field-label">오른쪽 컬럼 헤더</div>
        <input type="text" id="f-col-right" value="내용" oninput="render()">
      </div>
    </div>
  </div>

  <!-- Rows -->
  <div class="section-block">
    <div class="section-block-header">📊 행 편집</div>
    <div class="section-block-body">
      <div class="rows-area" id="rows-area"></div>
      <div class="add-row-area">
        <button class="add-btn" onclick="addRow()">＋ 행 추가</button>
        <button class="add-btn" onclick="addSection()">＋ 섹션 구분선 추가</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="section-block">
    <div class="section-block-header">📌 푸터</div>
    <div class="section-block-body">
      <div class="field-row">
        <div class="field-label">푸터 텍스트</div>
        <textarea id="f-footer" oninput="render()">Data as reported · 수치는 공모 확정 기준이며 시장 상황에 따라 변동될 수 있습니다</textarea>
      </div>
    </div>
  </div>

</div>

<!-- PREVIEW -->
<div id="preview">
  <div class="nyt-card" id="nyt-card"></div>
</div>

<!-- EXPORT MODAL -->
<div id="export-modal">
  <div class="modal-box">
    <div class="modal-header">
      HTML 내보내기
      <button class="icon-btn" onclick="closeExport()">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="export-code" readonly spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="copyExport()">📋 클립보드 복사</button>
      <button class="btn btn-gold" onclick="downloadHTML()">↓ 다운로드</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───
let rows = [];
let dragSrc = null;

const BADGE_OPTIONS = [
  { value: '', label: '없음' },
  { value: 'badge-dark', label: '검정 배지' },
  { value: 'badge-muted', label: '베이지 배지' },
  { value: 'badge-red', label: '빨간 배지' },
  { value: 'badge-green', label: '초록 배지' },
];

// ─── DEFAULT DATA ───
function resetToDefault() {
  rows = [
    { type: 'section', label: '기본 정보' },
    { type: 'row', label: '상장 시장', value: '코스피', unit: '', badge: 'badge-dark', badgeText: 'KOSPI', highlight: false },
    { type: 'row', label: '공모가', value: '8,300', unit: '원', badge: 'badge-muted', badgeText: '밴드 하단', highlight: false },
    { type: 'row', label: '예상 시가총액', value: '3조 3,673', unit: '억 원', badge: '', badgeText: '', highlight: false },
    { type: 'row', label: '총 공모금액', value: '4,980', unit: '억 원', badge: '', badgeText: '', highlight: false },
    { type: 'section', label: '수요예측 & 청약' },
    { type: 'row', label: '기관 수요예측 경쟁률', value: '199 : 1', unit: '', badge: '', badgeText: '', highlight: true },
    { type: 'row', label: '일반청약 경쟁률', value: '134.6 : 1', unit: '', badge: '', badgeText: '', highlight: false },
    { type: 'row', label: '청약 증거금', value: '9조 8,000', unit: '억 원', badge: '', badgeText: '', highlight: true },
    { type: 'section', label: '유통 & 의무보유확약' },
    { type: 'row', label: '최종 의무보유확약 비율', value: '50.95', unit: '%', badge: '', badgeText: '', highlight: false },
    { type: 'row', label: '최종 유통 가능 물량', value: '33.56', unit: '%', badge: '', badgeText: '', highlight: false },
    { type: 'row', label: '유통 가능 물량 (금액)', value: '1조 1,301', unit: '억 원', badge: '', badgeText: '', highlight: false },
  ];
  document.getElementById('f-eyebrow').value = '공모주 분석 · IPO Report';
  document.getElementById('f-headline').value = '코스피 신규 상장 공모 현황';
  document.getElementById('f-subhead').value = '밴드 하단 공모가 확정, 의무보유확약 50% 돌파';
  document.getElementById('f-col-left').value = '항목';
  document.getElementById('f-col-right').value = '내용';
  document.getElementById('f-footer').value = 'Data as reported · 수치는 공모 확정 기준이며 시장 상황에 따라 변동될 수 있습니다';
  renderEditor();
  render();
}

// ─── EDITOR RENDER ───
function renderEditor() {
  const area = document.getElementById('rows-area');
  area.innerHTML = '';

  rows.forEach((row, i) => {
    if (row.type === 'section') {
      const div = document.createElement('div');
      div.className = 'section-divider-item';
      div.draggable = true;
      div.dataset.index = i;
      div.innerHTML = `
        <span style="color:var(--editor-accent);font-family:var(--mono);font-size:11px;">§</span>
        <input type="text" value="${esc(row.label)}" placeholder="섹션명" 
          style="background:transparent;border:none;flex:1;color:var(--editor-accent);font-style:italic;"
          oninput="updateField(${i},'label',this.value)">
        <button class="icon-btn move" title="드래그">⠿</button>
        <button class="icon-btn danger" onclick="removeRow(${i})" title="삭제">✕</button>
      `;
      bindDrag(div, i);
      area.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = `row-item${row.highlight ? ' highlighted' : ''}`;
      div.draggable = true;
      div.dataset.index = i;

      const badgeOpts = BADGE_OPTIONS.map(b =>
        `<option value="${b.value}" ${row.badge === b.value ? 'selected' : ''}>${b.label}</option>`
      ).join('');

      div.innerHTML = `
        <div class="row-item-top">
          <div>
            <span class="mini-label">항목명 (Label)</span>
            <input type="text" value="${esc(row.label)}" placeholder="항목명" oninput="updateField(${i},'label',this.value)">
          </div>
          <div>
            <span class="mini-label">값 (Value)</span>
            <input type="text" value="${esc(row.value)}" placeholder="값" oninput="updateField(${i},'value',this.value)">
          </div>
        </div>
        <div class="row-item-bottom">
          <div>
            <span class="mini-label">단위 (Unit)</span>
            <input type="text" value="${esc(row.unit)}" placeholder="원, %, 억..." oninput="updateField(${i},'unit',this.value)">
          </div>
          <div>
            <span class="mini-label">배지 종류</span>
            <select class="badge-select" onchange="updateField(${i},'badge',this.value)">${badgeOpts}</select>
          </div>
          <div>
            <span class="mini-label">배지 텍스트</span>
            <input type="text" value="${esc(row.badgeText)}" placeholder="배지 내용" oninput="updateField(${i},'badgeText',this.value)">
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:16px;">
            <button class="icon-btn move" title="드래그">⠿</button>
          </div>
        </div>
        <div class="row-controls">
          <button class="toggle-btn ${row.highlight ? 'active' : ''}" onclick="toggleHighlight(${i})">
            ${row.highlight ? '★ 강조됨' : '☆ 강조'}
          </button>
          <button class="icon-btn" onclick="moveRowUp(${i})" title="위로">↑</button>
          <button class="icon-btn" onclick="moveRowDown(${i})" title="아래로">↓</button>
          <button class="icon-btn danger" onclick="removeRow(${i})" title="삭제" style="margin-left:auto">✕</button>
        </div>
      `;
      bindDrag(div, i);
      area.appendChild(div);
    }
  });
}

function bindDrag(div, i) {
  div.addEventListener('dragstart', e => {
    dragSrc = i;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => div.style.opacity = '0.4', 0);
  });
  div.addEventListener('dragend', () => { div.style.opacity = ''; });
  div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
  div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
  div.addEventListener('drop', e => {
    e.preventDefault();
    div.classList.remove('drag-over');
    if (dragSrc !== null && dragSrc !== i) {
      const moved = rows.splice(dragSrc, 1)[0];
      rows.splice(i, 0, moved);
      renderEditor();
      render();
    }
  });
}

function updateField(i, field, val) {
  rows[i][field] = val;
  render();
}

function toggleHighlight(i) {
  rows[i].highlight = !rows[i].highlight;
  renderEditor();
  render();
}

function removeRow(i) {
  rows.splice(i, 1);
  renderEditor();
  render();
}

function moveRowUp(i) {
  if (i === 0) return;
  [rows[i-1], rows[i]] = [rows[i], rows[i-1]];
  renderEditor();
  render();
}

function moveRowDown(i) {
  if (i >= rows.length - 1) return;
  [rows[i], rows[i+1]] = [rows[i+1], rows[i]];
  renderEditor();
  render();
}

function addRow() {
  rows.push({ type: 'row', label: '', value: '', unit: '', badge: '', badgeText: '', highlight: false });
  renderEditor();
  render();
}

function addSection() {
  rows.push({ type: 'section', label: '새 섹션' });
  renderEditor();
  render();
}

// ─── PREVIEW RENDER ───
function render() {
  const eyebrow = document.getElementById('f-eyebrow').value;
  const headline = document.getElementById('f-headline').value;
  const subhead = document.getElementById('f-subhead').value;
  const colLeft = document.getElementById('f-col-left').value;
  const colRight = document.getElementById('f-col-right').value;
  const footer = document.getElementById('f-footer').value;

  let tbody = '';
  rows.forEach(row => {
    if (row.type === 'section') {
      tbody += `<tr class="nyt-section-label"><td colspan="2">${esc(row.label)}</td></tr>`;
    } else {
      const badge = row.badge && row.badgeText
        ? `<span class="nyt-badge ${row.badge}">${esc(row.badgeText)}</span>` : '';
      const unit = row.unit ? `<span class="unit">${esc(row.unit)}</span>` : '';
      const hlClass = row.highlight ? ' row-highlighted' : '';
      tbody += `
        <tr class="${hlClass}">
          <td class="td-label">${esc(row.label)}</td>
          <td class="td-value">${esc(row.value)}${unit}${badge}</td>
        </tr>`;
    }
  });

  document.getElementById('nyt-card').innerHTML = `
    <div class="nyt-eyebrow">${esc(eyebrow)}</div>
    <div class="nyt-headline">${esc(headline)}</div>
    ${subhead ? `<div class="nyt-subhead">${esc(subhead)}</div>` : ''}
    <hr class="nyt-divider">
    <table class="nyt-table">
      <thead>
        <tr>
          <th>${esc(colLeft)}</th>
          <th>${esc(colRight)}</th>
        </tr>
      </thead>
      <tbody>${tbody}</tbody>
    </table>
    ${footer ? `<div class="nyt-footer">${esc(footer)}</div>` : ''}
  `;
}

.nyt-headline { font-family: 'Playfair Display', 'Noto Serif KR', Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.25; color: #111; margin-bottom: 6px; letter-spacing: -0.01em; }
.nyt-subhead { font-size: 13.5px; font-weight: 300; color: #555; line-height: 1.5; margin-bottom: 28px; font-style: italic; }

function openExport() {
  document.getElementById('export-code').value = buildExportHTML();
  document.getElementById('export-modal').classList.add('open');
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('open');
}

function copyExport() {
  const ta = document.getElementById('export-code');
  ta.select();
  document.execCommand('copy');
  const btn = event.target;
  btn.textContent = '✓ 복사됨!';
  setTimeout(() => btn.textContent = '📋 클립보드 복사', 1500);
}

function downloadHTML() {
  const blob = new Blob([buildExportHTML()], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nyt-table.html';
  a.click();
}

// ─── UTILS ───
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ───
resetToDefault();
